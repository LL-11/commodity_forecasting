[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-ai"
version = "0.1.0"
description = "Point-in-time-correct Henry Hub forecasting and market intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=1.0"]
ui = ["streamlit>=1.40", "altair>=5.0"]
ml = ["xgboost>=2.1", "shap>=0.46", "mlflow>=2.17"]
agent = ["openai>=1.54"]
all = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.0",
    "streamlit>=1.40",
    "altair>=5.0",
    "xgboost>=2.1",
    "shap>=0.46",
    "mlflow>=2.17",
    "openai>=1.54",
]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
commodity-ai = "commodity_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
